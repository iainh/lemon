[package]
name = "lemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Run Linux VMs and containers as launchd services on macOS"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
directories = "6.0"
libc = "0.2"
plist = "=1.8.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
xz2 = "0.1"
