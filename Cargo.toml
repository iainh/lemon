[package]
name = "lemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Run Linux VMs and containers as launchd services on macOS"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"
